version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: mongo_dev
    restart: always
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_DEV_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_DEV_PASS}
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data: